name: 每日节点抓取

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取最新节点
        run: |
          mkdir -p docs

          # 获取分类页最新文章链接
          LATEST_URL=$(curl -sL --connect-timeout 20 --max-time 45 "https://yoyapai.com/category/mianfeijiedian" \
            | sed 's/&#47;/\//g' \
            | grep -oE 'https://yoyapai\.com/[0-9]+' \
            | head -1)

          if [ -z "$LATEST_URL" ]; then
            echo "ERROR: 无法获取最新文章链接"
            exit 1
          fi

          # 获取文章内容
          PAGE=$(curl -sL --connect-timeout 20 --max-time 45 "$LATEST_URL")
          PAGE=$(echo "$PAGE" | sed 's/&#47;/\//g; s/&amp;/\&/g; s/&lt;/</g; s/&gt;/>/g')

          # 提取订阅链接
          CLASH_URL=$(echo "$PAGE" | grep -oE 'https://freenode\.yoyapai\.com/[^"<> ]+\.yaml' | head -1)
          V2RAY_URL=$(echo "$PAGE" | grep -oE 'https://freenode\.yoyapai\.com/[^"<> ]+\.txt' | head -1)

          # 提取信息
          DATE=$(echo "$PAGE" | grep -oE '[0-9]{4}年[0-9]{1,2}月[0-9]{1,2}日' | head -1)
          COUNT=$(echo "$PAGE" | grep -oE '更新数量[：:][0-9]+' | grep -oE '[0-9]+' | head -1)
          SPEED=$(echo "$PAGE" | grep -oE '实测速度[：:][0-9.]+MB/s' | head -1 | sed 's/.*[：:]//')

          # 下载完整配置
          if [ -n "$CLASH_URL" ]; then
            curl -sL --connect-timeout 20 --max-time 60 "$CLASH_URL" > docs/clash-config.yaml
          fi
          if [ -n "$V2RAY_URL" ]; then
            curl -sL --connect-timeout 20 --max-time 60 "$V2RAY_URL" > docs/v2ray-nodes.txt
          fi

          # 提取纯节点链接
          grep -E '^(vmess|vless|trojan|ss|ssr|hysteria2?)://' docs/v2ray-nodes.txt > docs/v2ray-links.txt 2>/dev/null || true
          NODE_COUNT=$(wc -l < docs/v2ray-links.txt)

          # 生成 JSON
          python3 -c "
          import json
          lines = [l.strip() for l in open('docs/v2ray-links.txt') if l.strip()]
          with open('docs/nodes.json', 'w') as f:
              json.dump(lines, f)
          "

          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "COUNT=$NODE_COUNT" >> $GITHUB_ENV
          echo "SPEED=$SPEED" >> $GITHUB_ENV
          echo "CLASH_URL=$CLASH_URL" >> $GITHUB_ENV

      - name: 生成页面
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>每日免费节点</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          body{font-family:-apple-system,sans-serif;background:#0d1117;color:#e6edf3;padding:16px;max-width:600px;margin:0 auto}
          .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;margin:12px 0}
          h1{font-size:20px;margin-bottom:8px}
          .d{color:#58a6ff;font-size:14px;margin-bottom:16px}
          .i{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
          .i span{background:#21262d;padding:6px 12px;border-radius:8px;font-size:13px}
          .l{color:#8b949e;font-size:13px;margin:12px 0 6px}
          .btn{background:#238636;color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;cursor:pointer;width:100%;margin:4px 0}
          .btn:active{background:#2ea043}
          .btn2{background:#1f6feb;color:#fff;border:none;padding:12px;border-radius:8px;font-size:14px;cursor:pointer;width:100%;margin:4px 0}
          .btn2:active{background:#388bfd}
          .nodes{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;font-size:11px;font-family:monospace;word-break:break-all;max-height:400px;overflow-y:auto;margin:8px 0;color:#7ee787;line-height:1.8}
          .node{padding:4px 0;border-bottom:1px solid #21262d;cursor:pointer}
          .node:last-child{border:none}
          .n{color:#8b949e;font-size:12px;line-height:1.8}
          .search{width:100%;padding:10px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:13px;margin:8px 0}
          .sub{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px;font-size:11px;font-family:monospace;word-break:break-all;margin:8px 0;color:#58a6ff}
          a{color:#58a6ff;text-decoration:none}
          </style>
          </head>
          <body>
          <div class="card">
          <h1>🚀 每日免费节点</h1>
          <div class="d">__DATE__</div>
          <div class="i">
          <span>📊 __COUNT__ 条线路</span>
          <span>⚡ __SPEED__</span>
          </div>

          <button class="btn" onclick="location.href='v2ray-nodes.txt'" style="background:#238636">⬇️ 下载 V2Ray 全部节点 (txt)</button>
          <button class="btn" onclick="location.href='v2ray-links.txt'" style="background:#1f6feb">⬇️ 下载纯节点链接 (txt)</button>
          <button class="btn" onclick="location.href='clash-config.yaml'" style="background:#8957e5">⬇️ 下载 Clash 配置 (yaml)</button>

          <div class="l">🔍 筛选节点：</div>
          <input class="search" id="search" placeholder="输入关键词：美国、日本、香港、trojan、vmess..." oninput="filter()">

          <div class="l">📋 V2Ray 节点（点击单独复制）：</div>
          <div class="nodes" id="nodes">加载中...</div>

          <button class="btn2" onclick="copyAll()">📋 复制全部节点（V2RayNG 从剪贴板导入）</button>

          <div class="l">🔗 Clash 订阅链接：</div>
          <div class="sub" id="clash-url">__CLASH_URL__</div>
          <button class="btn" onclick="copySub()">📋 复制 Clash 链接</button>

          <div class="n">
          💡 <b>V2RayNG 导入方法：</b><br>
          方式1: 下载 txt → V2RayNG → 右上角+ → 导入配置文件<br>
          方式2: 复制全部节点 → V2RayNG → 右上角+ → 从剪贴板导入<br><br>
          💡 <b>FlClash 导入方法：</b><br>
          复制 Clash 链接 → FlClash 配置 → 粘贴 → 确定<br><br>
          ⚠️ 免费节点多人共享，高峰可能较慢<br>
          🕐 每天北京时间 08:00 自动更新
          </div>
          </div>

          <script>
          let nodes=[], filtered=[];
          fetch('nodes.json').then(r=>r.json()).then(d=>{nodes=d;filtered=[...d];render()}).catch(()=>document.getElementById('nodes').textContent='暂无节点');

          function render(){
            const el=document.getElementById('nodes');
            if(!filtered.length){el.innerHTML='暂无节点';return;}
            el.innerHTML=filtered.map((n,i)=>'<div class="node" onclick="copyOne(this,'+i+')">'+n.replace(/#/g,' #')+'</div>').join('');
          }

          function filter(){
            const q=document.getElementById('search').value.toLowerCase();
            filtered=nodes.filter(n=>n.toLowerCase().includes(q));
            render();
          }

          function copyOne(el,i){
            navigator.clipboard.writeText(filtered[i]).then(()=>{
              el.style.color='#3fb950';setTimeout(()=>el.style.color='',1500);
            });
          }

          function copyAll(){
            navigator.clipboard.writeText(filtered.join('\n')).then(()=>{
              const btn=event.target;
              btn.textContent='✅ 已复制 '+filtered.length+' 条节点！';
              setTimeout(()=>btn.textContent='📋 复制全部节点（V2RayNG 从剪贴板导入）',3000);
            });
          }

          function copySub(){
            const t=document.getElementById('clash-url').textContent;
            navigator.clipboard.writeText(t).then(()=>{
              const btn=event.target;btn.textContent='✅ 已复制！';
              setTimeout(()=>btn.textContent='📋 复制 Clash 链接',2000);
            });
          }
          </script>
          </body>
          </html>
          EOF

          # 替换占位符
          sed -i "s|__DATE__|${{ env.DATE }}|g" docs/index.html
          sed -i "s|__COUNT__|${{ env.COUNT }}|g" docs/index.html
          sed -i "s|__SPEED__|${{ env.SPEED }}|g" docs/index.html
          sed -i "s|__CLASH_URL__|${{ env.CLASH_URL }}|g" docs/index.html

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
